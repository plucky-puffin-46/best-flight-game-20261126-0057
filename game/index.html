<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Puffin Air Rally: a 3D ring-rally flight game in Three.js. Fly a little orange prop plane through eight glowing rings over an island archipelago, then land on the runway. Chase and cockpit views, live instruments, real shadows.">
<title>Puffin Air Rally — a ring rally flight game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1626; }
  canvas.layer { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { pointer-events: none; }
  /* Spoken status for screen readers; never painted. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="gl" class="layer" aria-label="Puffin Air Rally: fly the little orange prop plane through every glowing ring in order, then land on the runway"></canvas>
<canvas id="hud" class="layer"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<noscript><p style="color:#eaf4ff;font-family:system-ui,sans-serif;padding:2rem">Puffin Air Rally needs JavaScript: the whole game, islands and all, is drawn by it.</p></noscript>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src3/main3.js"></script>
</body>
</html>
